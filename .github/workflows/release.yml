# Push to main -> test, build, publish a GitHub Release with the artifacts.
#
# Produces, on every push to main that passes the tests:
#   daj-rider-<version>.apk        the rider Android app, installable directly
#   daj-admin-web-<version>.zip    the built admin dashboard, for any static host
#   daj-backend-<version>.zip      the compiled API, for a host without a build step
#
# Version comes from the VERSION file plus the run number, so tags increase
# monotonically: VERSION=0.1.0 and run 7 give v0.1.0-build.7.
#
# Pushing a v* tag by hand instead produces a clean release at that exact tag.

name: Release

on:
  push:
    branches: [main]
    # A docs-only change should not cut a release.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**.md'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you building this release?
        required: false
        default: Manual build

permissions:
  contents: write # needed to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abandon a half-published release

jobs:
  # Gate: no release from a commit whose tests fail.
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      version_code: ${{ steps.v.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Compute version, tag and Android version code
        run: |
          set -euo pipefail
          BASE="$(tr -d ' \n\r' < VERSION)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Hand-pushed tag: use it verbatim.
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="${BASE}-build.${GITHUB_RUN_NUMBER}"
            TAG="v${VERSION}"
          fi

          # versionCode must increase for every build Android ever sees.
          VERSION_CODE="${GITHUB_RUN_NUMBER}"

          echo "version=${VERSION}"           >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                   >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          echo "Building ${TAG} (versionCode ${VERSION_CODE})"

  android:
    name: Build rider APK
    needs: [test, version]
    runs-on: ubuntu-latest
    # The New Architecture compiles native code for four ABIs; the first run
    # with a cold Gradle cache is slow.
    timeout-minutes: 90
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}

    env:
      VERSION_NAME: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rider-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Platforms are published with a minor version now: the package is
          # "platforms;android-37.0", and a plain "platforms;android-37" does
          # not exist, which fails sdkmanager with "Failed to find package".
          # compileSdkVersion 37 in android/build.gradle resolves to this.
          packages: >-
            platforms;android-37.0
            build-tools;37.0.0
            ndk;27.1.12297006

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install JS dependencies
        working-directory: rider-app
        run: npm ci

      - id: keystore
        name: Decode the release keystore, if one is configured
        working-directory: rider-app/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore in place."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — the APK will be debug-signed. See README for how to add one."
          fi

      - name: Build the release APK
        working-directory: rider-app/android
        # chmod as a safety net: the executable bit is set in git, but a commit
        # from a Windows checkout (core.fileMode=false) can drop it again, and
        # the failure — "./gradlew: Permission denied" — is not obvious.
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && 'release.keystore' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK after the version
        run: |
          set -euo pipefail
          SRC="rider-app/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC" || { echo "APK not found at $SRC"; ls -R rider-app/android/app/build/outputs || true; exit 1; }
          mkdir -p dist
          cp "$SRC" "dist/daj-rider-${{ needs.version.outputs.version }}.apk"
          ls -lh dist

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f rider-app/android/app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

  web:
    name: Build admin dashboard
    needs: [test, version]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install
        working-directory: admin-web
        run: npm ci

      - name: Build
        working-directory: admin-web
        # The dashboard reads its API URL at build time, so the deployed URL has
        # to be known here. Set the API_BASE_URL variable (Settings ->
        # Actions -> Variables) or the bundle points at localhost.
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:4000' }}
        run: npm run build

      - name: Zip the bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          cd admin-web/dist
          zip -r "../../dist/daj-admin-web-${{ needs.version.outputs.version }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: admin-web
          path: dist/*.zip
          retention-days: 30
          if-no-files-found: error

  api:
    name: Build API bundle
    needs: [test, version]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npx prisma generate && npx tsc -p tsconfig.json

      - name: Zip the compiled API with what it needs to run
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp -r backend/dist staging/dist
          cp -r backend/prisma staging/prisma
          cp backend/package.json backend/package-lock.json backend/.env.example staging/
          cd staging
          zip -r "../dist/daj-backend-${{ needs.version.outputs.version }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: backend-bundle
          path: dist/*.zip
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: [version, android, web, api]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history for the changelog

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          SIGNED: ${{ needs.android.outputs.signed }}
        run: |
          set -euo pipefail
          {
            echo "Automated build from \`main\` — commit \`${GITHUB_SHA:0:7}\`."
            echo
            echo "### Downloads"
            echo
            echo "| File | What it is |"
            echo "|---|---|"
            echo "| \`daj-rider-${VERSION}.apk\` | Rider Android app. Download on the phone and open it to install. |"
            echo "| \`daj-admin-web-${VERSION}.zip\` | Built admin dashboard. Unzip onto any static host. |"
            echo "| \`daj-backend-${VERSION}.zip\` | Compiled API. \`npm ci --omit=dev && npx prisma migrate deploy && node dist/src/index.js\`. |"
            echo

            if [[ "$SIGNED" != "true" ]]; then
              echo "> **This APK is signed with the public debug key.**"
              echo "> It installs and runs, but is not fit for the Play Store and"
              echo "> cannot be upgraded in place by a properly signed build later."
              echo "> Add the \`ANDROID_KEYSTORE_BASE64\` secret to fix this — see the README."
              echo
            fi

            echo "### Changes"
            echo
            PREV="$(git tag --list 'v*' --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)"
            if [[ -n "$PREV" ]]; then
              echo "Since \`${PREV}\`:"
              echo
              git log --no-merges --pretty='- %s' "${PREV}..HEAD" | head -50
            else
              echo "First release. Recent commits:"
              echo
              git log --no-merges --pretty='- %s' -15
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create the release and attach the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -lh artifacts

          # Re-running a build for the same tag replaces the release rather than
          # failing, so a retry after a flake is harmless.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing its assets."
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            --title "Durgesh Amla Juice $VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --latest \
            artifacts/*

          echo "Published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
