# Option 1 deployment: the API and PostgreSQL on the owner's own Linux server,
# reached from the internet through Cloudflare Tunnel (no ports forwarded).
#
#   cp .env.docker.example .env
#   docker compose up -d db
#   docker compose run --rm api npx prisma migrate deploy
#   docker compose run --rm api npx tsx prisma/seed.ts   # first time only
#   docker compose up -d api
#   docker compose --profile tunnel up -d cloudflared     # once you have a token

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-daj}
      # Keep timestamps unambiguous; the app decides business days itself.
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    # Bound to localhost only: nothing but this host can reach Postgres.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-daj} -d ${POSTGRES_DB:-daj}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-daj}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-daj}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the admin site origin}
      TRUST_PROXY: 'true'
      TZ_BUSINESS: ${TZ_BUSINESS:-Asia/Kolkata}
      RENEWAL_ALERT_DAYS: ${RENEWAL_ALERT_DAYS:-2}
      ENABLE_CRON: ${ENABLE_CRON:-true}
      ROUTE_CRON: ${ROUTE_CRON:-30 4 * * *}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Also localhost-only: Cloudflare Tunnel is what publishes it.
    ports:
      - '127.0.0.1:4000:4000'

  # Nightly pg_dump into ./backups, pruned after BACKUP_KEEP_DAYS.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-daj}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-daj}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/backup-loop.sh']

  # Publishes the API over HTTPS without opening a port on the network.
  # Create the tunnel in the Cloudflare dashboard, point the hostname at
  # http://api:4000, and put the token in .env as CLOUDFLARE_TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ['tunnel']
    depends_on:
      - api
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  db-data:
